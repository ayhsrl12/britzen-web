backend:
  name: github
  repo: ayhsrl12/britzen-web  
  branch: main
  base_url: https://britzen-decap-proxy.ventas-38a.workers.dev
  auth_endpoint: /auth

# Las fotos que subas desde el panel se guardan acá:
media_folder: "assets/img/productos"
public_folder: "/assets/img/productos"

collections:
  - name: "productos"
    label: "Productos"
    folder: "content/productos"
    create: true
    slug: "{{fields.sku}}"
    identifier_field: title
    summary: "{{title}} — Cód. {{sku}}"
    fields:
      - { label: "Código (SKU)", name: "sku", widget: "string", hint: "El código interno del producto, ej. 1233 o NEVIS-22" }
      - { label: "Título", name: "title", widget: "string" }
      - label: "Categoría"
        name: "category"
        widget: "select"
        options:
          - "Prensa Válvula"
          - "Juego de Llaves"
          - "Compresómetro"
          - "Estetoscopio"
          - "Frenos"
          - "Puesta a Punto"
          - "Torquímetro"
          - "Fresador"
          - "Extractor"
          - "Vacuómetro"
          - "Suspensión"
          - "Bomba Trasvase"
          - "Sondas"
          - "Embrague"
          - "Refrigeración"
          - "Morsa"
        hint: "Si necesitás una categoría nueva que no está en la lista, avisá para agregarla (es un cambio de 1 línea en este archivo)."
      - { label: "Precio (ARS, sin puntos ni signo $)", name: "price", widget: "number", value_type: "int", required: false, hint: "Dejar vacío si todavía no tiene precio (va a mostrar 'Precio próximamente')" }
      - { label: "Código de Mercado Libre (MLA-...)", name: "mla", widget: "string", required: false, hint: "Ej: MLA-1234567890. Dejar vacío si no tiene publicación en ML." }
      - label: "Fotos"
        name: "photos"
        widget: "list"
        required: false
        field: { label: "Foto", name: "image", widget: "image" }
        hint: "Podés subir varias — la primera es la que se usa como foto principal en el catálogo. Tamaño recomendado: 1200x1200px, peso menor a 1MB (fotos de celular sin comprimir suelen pesar mucho más)."
      - label: "Descripción completa"
        name: "body"
        widget: "text"
        required: false
        hint: "Texto libre. Si escribís secciones como 'CARACTERÍSTICAS:', 'APLICACIONES:', 'IMPORTANTE:', el sitio las va a ordenar solo en bloques prolijos."
  - name: "inicio"
    label: "Página de inicio"
    files:
      - file: "content/home.yml"
        label: "Banners del carrusel"
        name: "home"
        fields:
          - label: "Banners del carrusel (arriba de todo)"
            name: "banners"
            widget: "list"
            required: false
            hint: "El primero de la lista se muestra primero. Se pueden reordenar arrastrando."
            fields:
              - {label: "Imagen", name: "image", widget: "image"}
              - {label: "Link al hacer clic (opcional)", name: "link", widget: "string", required: false, hint: "A dónde va la persona si toca este banner (ej. https://britzen.com.ar/catalogo.html). Dejar vacío si no querés que sea clickeable."}
                - {label: "Foto institucional (depósito)", name: "institutional_photo", widget: "image", required: false, hint: "Foto para la página Quiénes somos. Funciona mejor una foto cuadrada."}
                - {label: "Texto junto a la foto (opcional)", name: "institutional_caption", widget: "text", required: false, hint: "Si lo dejas vacío, se usa un texto por defecto sobre el depósito."}
